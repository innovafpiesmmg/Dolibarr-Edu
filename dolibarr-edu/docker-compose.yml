services:

  # ── Base de datos Dolibarr (MariaDB) ────────────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: dolibarr_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./init/mariadb.cnf:/etc/mysql/conf.d/dolibarr.cnf:ro
    networks:
      - dolibarr_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Dolibarr ERP ─────────────────────────────────────────────────────────────
  dolibarr:
    image: dolibarr/dolibarr:latest
    container_name: dolibarr_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_PORT: 3306
      DOLI_DB_USER: ${MYSQL_USER}
      DOLI_DB_PASSWORD: ${MYSQL_PASSWORD}
      DOLI_DB_NAME: ${MYSQL_DATABASE}
      DOLI_URL_ROOT: ${DOLI_URL_ROOT}
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}
      DOLI_ADMIN_EMAIL: ${DOLI_ADMIN_EMAIL}
      DOLI_COMPANY_NAME: ${DOLI_COMPANY_NAME}
      DOLI_COMPANY_COUNTRY_ID: "64"
      DOLI_MODULES: "modMultiCompany,modSociete,modFournisseur,modFacture,modProjet,modStock,modBanque,modContrat,modComptabilite,modHrm"
      DOLI_AUTH: "dolibarr"
      DOLI_HTTPS: "0"
      PHP_INI_DATE_TIMEZONE: "Europe/Madrid"
    volumes:
      - dolibarr_docs:/var/www/documents
      - ./modules:/var/www/html/custom
    ports:
      - "127.0.0.1:${APP_PORT:-8069}:80"
    networks:
      - dolibarr_net

  # ── Base de datos OpenProject (PostgreSQL) ───────────────────────────────────
  openproject_db:
    image: postgres:16-alpine
    container_name: dolibarr_op_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openproject
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: ${OP_DB_PASSWORD}
    volumes:
      - op_db_data:/var/lib/postgresql/data
    networks:
      - dolibarr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openproject"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── OpenProject (gestión de proyectos) ───────────────────────────────────────
  openproject:
    image: openproject/openproject:15
    container_name: dolibarr_openproject
    restart: unless-stopped
    depends_on:
      openproject_db:
        condition: service_healthy
    environment:
      OPENPROJECT_HOST__NAME: ${OP_HOST}
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_DEFAULT__LANGUAGE: "es"
      OPENPROJECT_EDITION: "community"
      DATABASE_URL: "postgres://openproject:${OP_DB_PASSWORD}@openproject_db/openproject"
      SECRET_KEY_BASE: ${OP_SECRET_KEY}
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
    volumes:
      - op_data:/var/openproject/assets
    ports:
      - "127.0.0.1:${OP_PORT:-8070}:80"
    networks:
      - dolibarr_net

  # ── Collabora Online (LibreOffice en el navegador) ───────────────────────────
  collabora:
    image: collabora/code:latest
    container_name: dolibarr_collabora
    restart: unless-stopped
    environment:
      aliasgroup1: "https://${DOLI_DOMAIN}|https://${OP_HOST}|https://${NC_HOST}"
      DONT_GEN_SSL_CERT: "YES"
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:welcome.enable=false
        --o:logging.level=warning
      username: ${COLLABORA_ADMIN:-admin}
      password: ${COLLABORA_PASSWORD}
    ports:
      - "127.0.0.1:${COLLABORA_PORT:-9980}:9980"
    networks:
      - dolibarr_net
    cap_add:
      - MKNOD

  # ── Base de datos Nextcloud (MariaDB) ────────────────────────────────────────
  # Solo arranca cuando COMPOSE_PROFILES=nextcloud está en .env
  nextcloud_db:
    profiles: ["nextcloud"]
    image: mariadb:10.11
    container_name: dolibarr_nc_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NC_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NC_DB_PASSWORD}
    volumes:
      - nc_db_data:/var/lib/mysql
    networks:
      - dolibarr_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nextcloud — Almacenamiento en la nube ─────────────────────────────────────
  # Solo arranca cuando COMPOSE_PROFILES=nextcloud está en .env
  nextcloud:
    profiles: ["nextcloud"]
    image: nextcloud:29
    container_name: dolibarr_nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud_db:
        condition: service_healthy
    environment:
      MYSQL_HOST: nextcloud_db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NC_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_HOST}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${NC_HOST}
      NEXTCLOUD_DEFAULT_LANGUAGE: es
      NEXTCLOUD_DEFAULT_LOCALE: es_ES
    volumes:
      - nc_data:/var/www/html
    ports:
      - "127.0.0.1:${NC_PORT:-8071}:80"
    networks:
      - dolibarr_net

  # ── Base de datos del Panel (PostgreSQL) ──────────────────────────────────────
  panel_db:
    image: postgres:16-alpine
    container_name: dolibarr_panel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: panel
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: ${PANEL_DB_PASSWORD}
    volumes:
      - panel_db_data:/var/lib/postgresql/data
    networks:
      - dolibarr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migrador de BD del Panel (corre y termina) ────────────────────────────────
  panel_migrator:
    build:
      context: ../
      dockerfile: dolibarr-edu/Dockerfile.api
      target: migrator
    image: dolibarr-edu-panel-migrator
    container_name: dolibarr_panel_migrator
    restart: on-failure
    depends_on:
      panel_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://panel:${PANEL_DB_PASSWORD}@panel_db:5432/panel
    networks:
      - dolibarr_net

  # ── Panel API (Node.js / Express) ─────────────────────────────────────────────
  panel_api:
    build:
      context: ../
      dockerfile: dolibarr-edu/Dockerfile.api
      target: api
    image: dolibarr-edu-panel-api
    container_name: dolibarr_panel_api
    restart: unless-stopped
    depends_on:
      panel_db:
        condition: service_healthy
      panel_migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8080"
      BASE_PATH: /api
      DATABASE_URL: postgresql://panel:${PANEL_DB_PASSWORD}@panel_db:5432/panel
      SESSION_SECRET: ${SESSION_SECRET}
      DOLIBARR_BASE_URL: ${DOLIBARR_BASE_URL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud:80}
      NC_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-}
      NC_HOST: ${NC_HOST:-}
    networks:
      - dolibarr_net

  # ── Panel Web (React + Nginx) ─────────────────────────────────────────────────
  panel_web:
    build:
      context: ../
      dockerfile: dolibarr-edu/Dockerfile.panel
    image: dolibarr-edu-panel-web
    container_name: dolibarr_panel_web
    restart: unless-stopped
    depends_on:
      - panel_api
    ports:
      - "127.0.0.1:${PANEL_PORT:-8068}:80"
    networks:
      - dolibarr_net

  # ── Cloudflare Tunnel ─────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dolibarr_tunnel
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TOKEN}
    networks:
      - dolibarr_net

volumes:
  db_data:
  dolibarr_docs:
  op_db_data:
  op_data:
  nc_db_data:
  nc_data:
  panel_db_data:

networks:
  dolibarr_net:
    driver: bridge
