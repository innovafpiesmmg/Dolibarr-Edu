version: "3.9"

services:

  # ── Base de datos Dolibarr (MariaDB) ────────────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: dolibarr_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./init/mariadb.cnf:/etc/mysql/conf.d/dolibarr.cnf:ro
    networks:
      - dolibarr_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Dolibarr ERP ─────────────────────────────────────────────────────────────
  dolibarr:
    image: dolibarr/dolibarr:latest
    container_name: dolibarr_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_PORT: 3306
      DOLI_DB_USER: ${MYSQL_USER}
      DOLI_DB_PASSWORD: ${MYSQL_PASSWORD}
      DOLI_DB_NAME: ${MYSQL_DATABASE}
      DOLI_URL_ROOT: ${DOLI_URL_ROOT}
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}
      DOLI_ADMIN_EMAIL: ${DOLI_ADMIN_EMAIL}
      DOLI_COMPANY_NAME: ${DOLI_COMPANY_NAME}
      DOLI_COMPANY_COUNTRY_ID: "64"
      DOLI_MODULES: "modMultiCompany,modSociete,modFournisseur,modFacture,modProjet,modStock,modBanque,modContrat,modComptabilite,modHrm"
      DOLI_AUTH: "dolibarr"
      DOLI_HTTPS: "0"
      PHP_INI_DATE_TIMEZONE: "Europe/Madrid"
    volumes:
      - dolibarr_docs:/var/www/documents
      - ./modules:/var/www/html/custom
    ports:
      - "127.0.0.1:${APP_PORT:-8069}:80"
    networks:
      - dolibarr_net

  # ── Base de datos OpenProject (PostgreSQL) ───────────────────────────────────
  openproject_db:
    image: postgres:16-alpine
    container_name: dolibarr_op_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openproject
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: ${OP_DB_PASSWORD:-openproject_secret}
    volumes:
      - op_db_data:/var/lib/postgresql/data
    networks:
      - dolibarr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openproject"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── OpenProject (gestión de proyectos) ───────────────────────────────────────
  openproject:
    image: openproject/openproject:15
    container_name: dolibarr_openproject
    restart: unless-stopped
    depends_on:
      openproject_db:
        condition: service_healthy
    environment:
      OPENPROJECT_HOST__NAME: ${OP_HOST:-proyectos.micentro.es}
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_DEFAULT__LANGUAGE: "es"
      OPENPROJECT_EDITION: "community"
      DATABASE_URL: "postgresql://openproject:${OP_DB_PASSWORD:-openproject_secret}@openproject_db/openproject"
      SECRET_KEY_BASE: ${OP_SECRET_KEY:-cambia_esta_clave_secreta_openproject}
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
    volumes:
      - op_data:/var/openproject/assets
    ports:
      - "127.0.0.1:${OP_PORT:-8070}:80"
    networks:
      - dolibarr_net

  # ── Collabora Online (LibreOffice en el navegador) ───────────────────────────
  collabora:
    image: collabora/code:latest
    container_name: dolibarr_collabora
    restart: unless-stopped
    environment:
      # Dominios permitidos para embeber el editor (regex)
      aliasgroup1: "https://${DOLI_DOMAIN:-erp.micentro.es}|https://${OP_HOST:-proyectos.micentro.es}"
      DONT_GEN_SSL_CERT: "YES"
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:welcome.enable=false
        --o:logging.level=warning
      username: ${COLLABORA_ADMIN:-admin}
      password: ${COLLABORA_PASSWORD:-cambia_esta_contrasena_collabora}
    ports:
      - "127.0.0.1:${COLLABORA_PORT:-9980}:9980"
    networks:
      - dolibarr_net
    cap_add:
      - MKNOD

  # ── Cloudflare Tunnel ────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dolibarr_tunnel
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TOKEN}
    networks:
      - dolibarr_net

volumes:
  db_data:
  dolibarr_docs:
  op_db_data:
  op_data:

networks:
  dolibarr_net:
    driver: bridge
