services:

  # ── Traefik — reverse proxy con descubrimiento automático ───────────────────
  # Enruta *.{BASE_DOMAIN} hacia los contenedores Dolibarr de cada alumno
  # mediante etiquetas Docker. Acepta tráfico HTTP del túnel Cloudflare; TLS
  # lo termina Cloudflare. Solo escucha en localhost (los puertos los expone
  # el túnel hacia el exterior).
  # Traefik con FILE PROVIDER: lee rutas de un directorio que el panel
  # mantiene actualizado. NO usa el socket Docker (su Go SDK negocia API
  # 1.24 y los daemons Engine 25+/29+ la rechazan). El panel es la única
  # fuente de verdad sobre qué alumnos existen, así que es más limpio.
  traefik:
    image: traefik:v3.3
    container_name: dolibarr_traefik
    restart: unless-stopped
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--log.level=WARN"
    ports:
      - "127.0.0.1:${TRAEFIK_PORT:-8090}:80"
    volumes:
      - traefik_dynamic:/etc/traefik/dynamic:ro
    networks:
      - dolibarr_net

  # ── MariaDB compartida — alberga una BD por alumno ─────────────────────────
  db:
    image: mariadb:10.11
    container_name: dolibarr_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./init/mariadb.cnf:/etc/mysql/conf.d/dolibarr.cnf:ro
    networks:
      - dolibarr_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Base de datos del Panel (PostgreSQL) ──────────────────────────────────────
  panel_db:
    image: postgres:16-alpine
    container_name: dolibarr_panel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: panel
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: ${PANEL_DB_PASSWORD}
    volumes:
      - panel_db_data:/var/lib/postgresql/data
    networks:
      - dolibarr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migrador de BD del Panel (corre y termina) ────────────────────────────────
  panel_migrator:
    build:
      context: ../
      dockerfile: dolibarr-edu/Dockerfile.api
      target: migrator
    image: dolibarr-edu-panel-migrator
    container_name: dolibarr_panel_migrator
    restart: on-failure
    depends_on:
      panel_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://panel:${PANEL_DB_PASSWORD}@panel_db:5432/panel
    networks:
      - dolibarr_net

  # ── Panel API (Node.js / Express) ─────────────────────────────────────────────
  # Necesita acceso al socket Docker para orquestar contenedores Dolibarr por alumno.
  panel_api:
    build:
      context: ../
      dockerfile: dolibarr-edu/Dockerfile.api
      target: api
    image: dolibarr-edu-panel-api
    container_name: dolibarr_panel_api
    restart: unless-stopped
    depends_on:
      panel_db:
        condition: service_healthy
      panel_migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      BASE_PATH: /api
      DATABASE_URL: postgresql://panel:${PANEL_DB_PASSWORD}@panel_db:5432/panel
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}

      # Orquestación de Dolibarr por alumno
      BASE_DOMAIN: ${BASE_DOMAIN}
      DOLIBARR_IMAGE: ${DOLIBARR_IMAGE:-dolibarr/dolibarr:latest}
      DOLIBARR_MODULES: ${DOLIBARR_MODULES:-modApi,modSociete,modFournisseur,modFacture,modProjet,modStock,modBanque,modContrat,modComptabilite,modHrm}
      STUDENT_DOCKER_NETWORK: ${STUDENT_DOCKER_NETWORK:-dolibarr_net}

      # MariaDB compartida
      MARIADB_HOST: db
      MARIADB_PORT: "3306"
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      # Directorio compartido con Traefik (file provider) — el panel
      # escribe aquí un .json por alumno desplegado.
      TRAEFIK_DYNAMIC_DIR: /etc/traefik/dynamic
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_dynamic:/etc/traefik/dynamic
    networks:
      - dolibarr_net

  # ── Panel Web (React + Nginx) — sirve panel + landing ────────────────────────
  panel_web:
    build:
      context: ../
      dockerfile: dolibarr-edu/Dockerfile.panel
    image: dolibarr-edu-panel-web
    container_name: dolibarr_panel_web
    restart: unless-stopped
    depends_on:
      - panel_api
    ports:
      - "127.0.0.1:${PANEL_PORT:-8068}:80"
    networks:
      - dolibarr_net

  # ── Cloudflare Tunnel — acceso público al panel y a los Dolibarr de alumnos ──
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    container_name: dolibarr_tunnel
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TOKEN}
    networks:
      - dolibarr_net

volumes:
  db_data:
  traefik_dynamic:
  panel_db_data:

networks:
  dolibarr_net:
    name: dolibarr_net
    driver: bridge
