version: "3.9"

services:
  db:
    image: mariadb:10.11
    container_name: dolibarr_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./init/mariadb.cnf:/etc/mysql/conf.d/dolibarr.cnf:ro
    networks:
      - dolibarr_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  dolibarr:
    image: dolibarr/dolibarr:latest
    container_name: dolibarr_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_PORT: 3306
      DOLI_DB_USER: ${MYSQL_USER}
      DOLI_DB_PASSWORD: ${MYSQL_PASSWORD}
      DOLI_DB_NAME: ${MYSQL_DATABASE}
      DOLI_URL_ROOT: ${DOLI_URL_ROOT}
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}
      DOLI_ADMIN_EMAIL: ${DOLI_ADMIN_EMAIL}
      DOLI_COMPANY_NAME: ${DOLI_COMPANY_NAME}
      DOLI_COMPANY_COUNTRY_ID: "64"
      DOLI_MODULES: "modMultiCompany,modSociete,modFournisseur,modFacture,modProjet,modStock,modBanque,modContrat,modComptabilite,modHrm"
      DOLI_AUTH: "dolibarr"
      DOLI_HTTPS: "0"
      PHP_INI_DATE_TIMEZONE: "Europe/Madrid"
    volumes:
      - dolibarr_docs:/var/www/documents
      - ./modules:/var/www/html/custom
    ports:
      - "127.0.0.1:${APP_PORT:-8069}:80"
    networks:
      - dolibarr_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dolibarr_tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflare:/etc/cloudflared:ro
    depends_on:
      - dolibarr
    networks:
      - dolibarr_net

volumes:
  db_data:
  dolibarr_docs:

networks:
  dolibarr_net:
    driver: bridge
