openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ERP EDU — API de gestión educativa
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Autenticación de administrador y acceso de alumnos
  - name: teachers
    description: Gestión de profesores
  - name: groups
    description: Gestión de grupos de clase
  - name: students
    description: Gestión de alumnos
  - name: stats
    description: Estadísticas del panel

paths:
  # ── Auth ──────────────────────────────────────────────
  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Login de administrador del panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanelCredentials"
      responses:
        "200":
          description: Token de sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelToken"
        "401":
          description: Contraseña incorrecta

  /auth/student-login:
    post:
      operationId: studentLogin
      tags: [auth]
      summary: Login de alumno para acceder a su empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlumnoCredentials"
      responses:
        "200":
          description: Datos del alumno y URL de la empresa en Dolibarr
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlumnoSesion"
        "401":
          description: Credenciales incorrectas

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Teachers ──────────────────────────────────────────
  /teachers:
    get:
      operationId: listTeachers
      tags: [teachers]
      summary: Listar profesores
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lista de profesores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Teacher"
    post:
      operationId: createTeacher
      tags: [teachers]
      summary: Crear profesor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherInput"
      responses:
        "201":
          description: Profesor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teachers/{id}:
    get:
      operationId: getTeacher
      tags: [teachers]
      summary: Obtener profesor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profesor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTeacher
      tags: [teachers]
      summary: Actualizar profesor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherUpdate"
      responses:
        "200":
          description: Profesor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTeacher
      tags: [teachers]
      summary: Eliminar profesor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teachers/{id}/deploy:
    post:
      operationId: deployTeacher
      tags: [teachers]
      summary: Desplegar Dolibarr propio del profesor (crear BD + contenedor)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Resultado del despliegue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherDeployResult" }
        "404":
          description: Profesor no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Docker o MariaDB no disponible / BASE_DOMAIN sin configurar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /teachers/{id}/dolibarr/state:
    get:
      operationId: getTeacherContainerState
      tags: [teachers]
      summary: Estado del contenedor Dolibarr del profesor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Estado actual del contenedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherContainerState" }
        "404":
          description: Profesor no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /teachers/{id}/dolibarr/start:
    post:
      operationId: startTeacherContainer
      tags: [teachers]
      summary: Arrancar el contenedor Dolibarr del profesor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contenedor arrancado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherContainerState" }
        "404":
          description: Profesor o contenedor no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /teachers/{id}/dolibarr/stop:
    post:
      operationId: stopTeacherContainer
      tags: [teachers]
      summary: Detener el contenedor Dolibarr del profesor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contenedor detenido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherContainerState" }
        "404":
          description: Profesor o contenedor no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /teachers/{id}/dolibarr:
    delete:
      operationId: destroyTeacherContainer
      tags: [teachers]
      summary: Eliminar contenedor y BD del Dolibarr del profesor (datos perdidos)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Contenedor y BD eliminados
        "404":
          description: Profesor no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /teachers/{id}/dolibarr/modules:
    post:
      operationId: enableTeacherDolibarrModules
      tags: [teachers]
      summary: Reactivar los módulos Dolibarr del profesor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Módulos activados
          content:
            application/json:
              schema:
                type: object
                required: [teacherId, enabled]
                properties:
                  teacherId: { type: integer }
                  enabled:
                    type: array
                    items: { type: string }
        "404":
          description: Profesor no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /teachers/{id}/groups:
    get:
      operationId: listTeacherGroups
      tags: [teachers]
      summary: Grupos de un profesor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grupos del profesor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"

  # ── Groups ────────────────────────────────────────────
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: Listar grupos
      parameters:
        - in: query
          name: teacherId
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lista de grupos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Crear grupo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Grupo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /groups/{id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Obtener grupo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grupo con sus alumnos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupWithStudents"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Actualizar grupo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Grupo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Eliminar grupo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  /groups/{id}/students:
    get:
      operationId: listGroupStudents
      tags: [groups]
      summary: Alumnos de un grupo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alumnos del grupo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

  # ── Students ──────────────────────────────────────────
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: Listar alumnos
      parameters:
        - in: query
          name: groupId
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lista de alumnos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Crear alumno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Alumno creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /students/bulk:
    post:
      operationId: createStudentsBulk
      tags: [students]
      summary: Alta masiva de alumnos (desde CSV)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentBulkInput"
      responses:
        "200":
          description: Resultado de la importación masiva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Obtener alumno
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alumno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Actualizar alumno
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Alumno actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Eliminar alumno
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  /students/{id}/deploy:
    post:
      operationId: deployStudent
      tags: [students]
      summary: Desplegar Dolibarr propio del alumno (crear BD + contenedor)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resultado del despliegue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResult"
        "404":
          description: Alumno no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Docker o MariaDB no disponible / BASE_DOMAIN sin configurar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /students/{id}/dolibarr/state:
    get:
      operationId: getStudentContainerState
      tags: [students]
      summary: Estado del contenedor Dolibarr del alumno
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Estado actual del contenedor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DolibarrContainerState" }
        "404":
          description: Alumno no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /students/{id}/dolibarr/start:
    post:
      operationId: startStudentContainer
      tags: [students]
      summary: Arrancar el contenedor Dolibarr del alumno
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contenedor arrancado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DolibarrContainerState" }
        "404":
          description: Alumno o contenedor no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Docker no disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /students/{id}/dolibarr/stop:
    post:
      operationId: stopStudentContainer
      tags: [students]
      summary: Detener el contenedor Dolibarr del alumno
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contenedor detenido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DolibarrContainerState" }
        "404":
          description: Alumno o contenedor no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Docker no disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /students/{id}/dolibarr:
    delete:
      operationId: destroyStudentContainer
      tags: [students]
      summary: Eliminar contenedor y BD del Dolibarr del alumno (datos perdidos)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Contenedor y BD eliminados
        "404":
          description: Alumno no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Docker no disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /students/{id}/dolibarr/modules:
    post:
      operationId: enableStudentDolibarrModules
      tags: [students]
      summary: Reactivar los módulos Dolibarr (contabilidad, facturación, nóminas, SS) del alumno
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Módulos activados
          content:
            application/json:
              schema:
                type: object
                required: [studentId, enabled]
                properties:
                  studentId: { type: integer }
                  enabled:
                    type: array
                    items: { type: string }
        "404":
          description: Alumno no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Error al activar módulos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /students/{id}/reset-password:
    post:
      operationId: resetStudentPassword
      tags: [students]
      summary: Genera una nueva contraseña para el alumno y la sincroniza con Dolibarr
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Nueva contraseña generada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResult"
        "404":
          description: Alumno no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /students/{id}/ss-summary:
    get:
      operationId: getSSSummary
      tags: [students]
      summary: "Resumen de cotizaciones SS por período (RNT + RLC)"
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: month
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
        - in: query
          name: year
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Resumen de cotizaciones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSSummary" }
        "404":
          description: Alumno no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /students/{id}/ss-pay:
    post:
      operationId: paySSLiquidacion
      tags: [students]
      summary: "Registrar pago SS en Dolibarr y contabilidad (476→572)"
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSPayInput" }
      responses:
        "200":
          description: Asiento de pago registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSPayResult" }
        "404":
          description: Alumno no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Dolibarr no configurado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /students/{id}/irpf-pay:
    post:
      operationId: payIRPFLiquidacion
      tags: [students]
      summary: "Registrar pago IRPF en Dolibarr (4751→572) — Modelo 111"
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSPayInput" }
      responses:
        "200":
          description: Asiento de pago IRPF registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSPayResult" }
        "404":
          description: Alumno no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Dolibarr no configurado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /groups/{id}/deploy-all:
    post:
      operationId: deployGroupStudents
      tags: [groups]
      summary: Desplegar todos los alumnos pendientes de un grupo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resultado del despliegue masivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployAllResult"
        "404":
          description: Grupo no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Employees (nóminas) ───────────────────────────────
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: Listar trabajadores
      parameters:
        - in: query
          name: studentId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista de trabajadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Crear trabajador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Trabajador creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Obtener trabajador
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trabajador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateEmployee
      tags: [employees]
      summary: Actualizar trabajador
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "200":
          description: Trabajador actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Eliminar trabajador
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminado

  # ── Payrolls (nóminas) ────────────────────────────────
  /payrolls/calculate:
    post:
      operationId: calculatePayroll
      tags: [payrolls]
      summary: Calcular nómina (sin guardar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollInput"
      responses:
        "200":
          description: Resultado del cálculo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollCalculation"

  /payrolls:
    get:
      operationId: listPayrolls
      tags: [payrolls]
      summary: Listar nóminas
      parameters:
        - in: query
          name: studentId
          schema:
            type: integer
        - in: query
          name: employeeId
          schema:
            type: integer
      responses:
        "200":
          description: Lista de nóminas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payroll"
    post:
      operationId: createPayroll
      tags: [payrolls]
      summary: Crear y guardar nómina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollInput"
      responses:
        "201":
          description: Nómina guardada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payroll"

  /payrolls/{id}:
    get:
      operationId: getPayroll
      tags: [payrolls]
      summary: Obtener nómina
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Nómina
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payroll"
        "404":
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePayroll
      tags: [payrolls]
      summary: Eliminar nómina
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminada

  # ── Activity log ──────────────────────────────────────
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Historial de actividad del panel
      parameters:
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: entityType
          schema: { type: string }
      responses:
        "200":
          description: Entradas de actividad
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

  # ── Settings ──────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Obtiene la configuración del panel
      responses:
        "200":
          description: Configuración actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Actualiza la configuración del panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Configuración actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  # ── Stats ─────────────────────────────────────────────
  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Estadísticas generales del panel
      responses:
        "200":
          description: Totales y métricas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  # ── Teacher auth ─────────────────────────────────────
  /auth/teacher-login:
    post:
      operationId: teacherLogin
      tags: [auth]
      summary: Login del profesor para su panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCredentials"
      responses:
        "200":
          description: Token de sesión del profesor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherSession"
        "401":
          description: Credenciales incorrectas

  # ── Teacher panel scoped (requires Bearer profesor) ──
  /teacher/me:
    get:
      operationId: getTeacherMe
      tags: [teacher-panel]
      summary: Perfil del profesor autenticado
      responses:
        "200":
          description: Profesor
          content: { application/json: { schema: { $ref: "#/components/schemas/TeacherProfile" } } }

  /teacher/me/dolibarr:
    get:
      operationId: getTeacherMyDolibarr
      tags: [teacher-panel]
      summary: Credenciales de acceso al Dolibarr del profesor
      responses:
        "200":
          description: Estado del contenedor del profesor
          content: { application/json: { schema: { $ref: "#/components/schemas/TeacherDolibarrInfo" } } }

  /teacher/me/groups:
    get:
      operationId: listTeacherMyGroups
      tags: [teacher-panel]
      summary: Grupos del profesor autenticado
      responses:
        "200":
          description: Lista de grupos
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Group" } } } }

  /teacher/me/stats:
    get:
      operationId: getTeacherMyStats
      tags: [teacher-panel]
      summary: Estadísticas del profesor
      responses:
        "200":
          description: Stats
          content: { application/json: { schema: { $ref: "#/components/schemas/TeacherStats" } } }

  /teacher/me/students:
    get:
      operationId: listTeacherMyStudents
      tags: [teacher-panel]
      summary: Alumnos de los grupos del profesor
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: groupId
          schema: { type: integer }
      responses:
        "200":
          description: Lista de alumnos
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Student" } } } }
    post:
      operationId: createTeacherMyStudent
      tags: [teacher-panel]
      summary: Crear alumno en uno de mis grupos
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StudentInput" } } }
      responses:
        "201":
          description: Alumno creado
          content: { application/json: { schema: { $ref: "#/components/schemas/Student" } } }

  /teacher/me/students/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateTeacherMyStudent
      tags: [teacher-panel]
      summary: Actualizar alumno
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StudentInput" } } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } }
    delete:
      operationId: deleteTeacherMyStudent
      tags: [teacher-panel]
      summary: Eliminar alumno
      responses:
        "204":
          description: Eliminado

  /teacher/me/students/{id}/reset-password:
    post:
      operationId: resetTeacherMyStudentPassword
      tags: [teacher-panel]
      summary: Resetear contraseña de un alumno
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Nueva contraseña
          content: { application/json: { schema: { $ref: "#/components/schemas/ResetPasswordSimple" } } }

  /teacher/me/students/{id}/dolibarr/deploy:
    post:
      operationId: deployTeacherMyStudentDolibarr
      tags: [teacher-panel]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Despliegue iniciado
          content: { application/json: { schema: { $ref: "#/components/schemas/SimpleDeployResult" } } }

  /teacher/me/students/{id}/dolibarr/start:
    post:
      operationId: startTeacherMyStudentDolibarr
      tags: [teacher-panel]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contenedor iniciado
          content: { application/json: { schema: { $ref: "#/components/schemas/SimpleStateResult" } } }

  /teacher/me/students/{id}/dolibarr/stop:
    post:
      operationId: stopTeacherMyStudentDolibarr
      tags: [teacher-panel]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contenedor detenido
          content: { application/json: { schema: { $ref: "#/components/schemas/SimpleStateResult" } } }

  /teacher/me/students/{id}/dolibarr/state:
    get:
      operationId: getTeacherMyStudentDolibarrState
      tags: [teacher-panel]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Estado del contenedor
          content: { application/json: { schema: { $ref: "#/components/schemas/StudentContainerState" } } }

  /teacher/me/students/{id}/dolibarr:
    delete:
      operationId: destroyTeacherMyStudentDolibarr
      tags: [teacher-panel]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Eliminado

  /teacher/me/teams:
    get:
      operationId: listTeacherMyTeams
      tags: [teacher-panel]
      responses:
        "200":
          description: Equipos del profesor
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Team" } } } }
    post:
      operationId: createTeacherMyTeam
      tags: [teacher-panel]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TeamInput" } } }
      responses:
        "201":
          description: Equipo creado
          content: { application/json: { schema: { $ref: "#/components/schemas/Team" } } }

  /teacher/me/teams/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getTeacherMyTeam
      tags: [teacher-panel]
      responses:
        "200":
          description: Equipo con miembros
          content: { application/json: { schema: { $ref: "#/components/schemas/TeamWithMembers" } } }
    delete:
      operationId: deleteTeacherMyTeam
      tags: [teacher-panel]
      responses:
        "204":
          description: Eliminado

  /teacher/me/teams/{id}/members:
    post:
      operationId: addTeacherMyTeamMember
      tags: [teacher-panel]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddTeamMemberInput" } } }
      responses:
        "200":
          description: Miembro añadido
          content: { application/json: { schema: { $ref: "#/components/schemas/AddTeamMemberResult" } } }

  /teacher/me/teams/{id}/members/{studentId}:
    delete:
      operationId: removeTeacherMyTeamMember
      tags: [teacher-panel]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: studentId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Miembro quitado
          content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } }

  # ── Teams (admin) ────────────────────────────────────
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      parameters:
        - in: query
          name: groupId
          schema: { type: integer }
      responses:
        "200":
          description: Lista de equipos
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Team" } } } }
    post:
      operationId: createTeam
      tags: [teams]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TeamInput" } } }
      responses:
        "201":
          description: Equipo creado
          content: { application/json: { schema: { $ref: "#/components/schemas/Team" } } }

  /teams/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getTeam
      tags: [teams]
      responses:
        "200":
          description: Equipo con miembros
          content: { application/json: { schema: { $ref: "#/components/schemas/TeamWithMembers" } } }
    delete:
      operationId: deleteTeam
      tags: [teams]
      responses:
        "204":
          description: Eliminado

  /teams/{id}/members:
    post:
      operationId: addTeamMember
      tags: [teams]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddTeamMemberInput" } } }
      responses:
        "200":
          description: Miembro añadido
          content: { application/json: { schema: { $ref: "#/components/schemas/AddTeamMemberResult" } } }

  /teams/{id}/members/{studentId}:
    delete:
      operationId: removeTeamMember
      tags: [teams]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: studentId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Miembro quitado
          content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Teacher ──────────────────────────────────────────
    Teacher:
      type: object
      required: [id, firstName, lastName, email, username, dolibarrSyncStatus, createdAt]
      properties:
        id:                 { type: integer }
        firstName:          { type: string }
        lastName:           { type: string }
        email:              { type: string }
        username:           { type: string }
        phone:              { type: ["string", "null"] }
        groupCount:         { type: integer }
        studentCount:       { type: integer }
        dolibarrSyncStatus: { type: string, enum: [pending, deploying, synced, error] }
        dolibarrSyncError:  { type: ["string", "null"] }
        dolibarrPassword:   { type: ["string", "null"], description: "Contraseña admin del Dolibarr propio del profesor." }
        createdAt:          { type: string, format: date-time }

    TeacherInput:
      type: object
      required: [firstName, lastName, email, username, password]
      properties:
        firstName:  { type: string, minLength: 1 }
        lastName:   { type: string, minLength: 1 }
        email:      { type: string, format: email }
        username:   { type: string, minLength: 3 }
        password:   { type: string, minLength: 8 }
        phone:      { type: string }

    TeacherUpdate:
      type: object
      properties:
        firstName:  { type: string, minLength: 1 }
        lastName:   { type: string, minLength: 1 }
        email:      { type: string, format: email }
        phone:      { type: string }

    # ── Group ────────────────────────────────────────────
    Group:
      type: object
      required: [id, name, courseYear, teacherId, teacherName, studentCount, createdAt]
      properties:
        id:           { type: integer }
        name:         { type: string }
        courseYear:   { type: string }
        description:  { type: ["string", "null"] }
        teacherId:    { type: integer }
        teacherName:  { type: string }
        studentCount: { type: integer }
        createdAt:    { type: string, format: date-time }

    GroupWithStudents:
      type: object
      required: [id, name, courseYear, teacherId, teacherName, studentCount, createdAt, students]
      properties:
        id:           { type: integer }
        name:         { type: string }
        courseYear:   { type: string }
        description:  { type: ["string", "null"] }
        teacherId:    { type: integer }
        teacherName:  { type: string }
        studentCount: { type: integer }
        createdAt:    { type: string, format: date-time }
        students:
          type: array
          items:
            $ref: "#/components/schemas/Student"

    GroupInput:
      type: object
      required: [name, courseYear, teacherId]
      properties:
        name:        { type: string, minLength: 1 }
        courseYear:  { type: string, minLength: 1 }
        description: { type: string }
        teacherId:   { type: integer }

    GroupUpdate:
      type: object
      properties:
        name:        { type: string, minLength: 1 }
        courseYear:  { type: string }
        description: { type: string }
        teacherId:   { type: integer }

    # ── Student ──────────────────────────────────────────
    Student:
      type: object
      required: [id, firstName, lastName, email, username, groupId, groupName, dolibarrSyncStatus, createdAt]
      properties:
        id:                  { type: integer }
        firstName:           { type: string }
        lastName:            { type: string }
        email:               { type: string }
        username:            { type: string }
        groupId:             { type: integer }
        groupName:           { type: string }
        dolibarrSyncStatus:  { type: string, enum: [pending, deploying, synced, error] }
        dolibarrSyncError:   { type: ["string", "null"] }
        dolibarrPassword:    { type: ["string", "null"], description: "Contraseña admin del Dolibarr propio del alumno." }
        companyName:         { type: ["string", "null"] }
        createdAt:           { type: string, format: date-time }

    StudentInput:
      type: object
      required: [firstName, lastName, email, username, password, groupId]
      properties:
        firstName:   { type: string, minLength: 1 }
        lastName:    { type: string, minLength: 1 }
        email:       { type: string, format: email }
        username:    { type: string, minLength: 3 }
        password:    { type: string, minLength: 6 }
        groupId:     { type: integer }
        companyName: { type: string }

    StudentUpdate:
      type: object
      properties:
        firstName:   { type: string, minLength: 1 }
        lastName:    { type: string, minLength: 1 }
        email:       { type: string, format: email }
        groupId:     { type: integer }
        companyName: { type: string }

    StudentBulkInput:
      type: object
      required: [groupId, students]
      properties:
        groupId:  { type: integer }
        students:
          type: array
          items:
            $ref: "#/components/schemas/StudentInput"

    BulkImportResult:
      type: object
      required: [created, errors]
      properties:
        created:  { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [username, error]
            properties:
              username: { type: string }
              error:    { type: string }

    DeployResult:
      type: object
      required: [studentId, status]
      properties:
        studentId:        { type: integer }
        status:           { type: string, enum: [synced, error, skipped, deploying] }
        containerName:    { type: ["string", "null"], description: "Nombre del contenedor Docker creado para el alumno." }
        publicUrl:        { type: ["string", "null"], description: "URL pública del Dolibarr del alumno (https://{user}.{baseDomain}/)." }
        containerState:   { type: ["string", "null"], description: "Estado del contenedor: running, exited, created, etc." }
        dolibarrPassword: { type: ["string", "null"] }
        error:            { type: ["string", "null"] }

    DolibarrContainerState:
      type: object
      required: [studentId, exists, state, publicUrl, containerName]
      properties:
        studentId:     { type: integer }
        exists:        { type: boolean }
        state:         { type: string, description: "running | exited | created | restarting | paused | dead | absent" }
        publicUrl:     { type: ["string", "null"] }
        containerName: { type: string }
        startedAt:     { type: ["string", "null"], format: date-time }

    TeacherDeployResult:
      type: object
      required: [teacherId, status]
      properties:
        teacherId:        { type: integer }
        status:           { type: string, enum: [synced, error, skipped, deploying] }
        containerName:    { type: ["string", "null"] }
        publicUrl:        { type: ["string", "null"] }
        containerState:   { type: ["string", "null"] }
        dolibarrPassword: { type: ["string", "null"] }
        error:            { type: ["string", "null"] }

    TeacherContainerState:
      type: object
      required: [teacherId, exists, state, publicUrl, containerName]
      properties:
        teacherId:     { type: integer }
        exists:        { type: boolean }
        state:         { type: string }
        publicUrl:     { type: ["string", "null"] }
        containerName: { type: string }
        startedAt:     { type: ["string", "null"], format: date-time }

    DeployAllResult:
      type: object
      required: [deployed, skipped, errors]
      properties:
        deployed: { type: integer }
        skipped:  { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [studentId, username, error]
            properties:
              studentId: { type: integer }
              username:  { type: string }
              error:     { type: string }

    # ── Auth ─────────────────────────────────────────────
    PanelCredentials:
      type: object
      required: [password]
      properties:
        password: { type: string }

    PanelToken:
      type: object
      required: [token]
      properties:
        token: { type: string }

    AlumnoCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    AlumnoSesion:
      type: object
      required: [firstName, lastName, groupName, dolibarrUrl, dolibarrUsername, dolibarrPassword, mode]
      properties:
        firstName:        { type: string }
        lastName:         { type: string }
        companyName:      { type: string, nullable: true }
        groupName:        { type: string }
        dolibarrUrl:      { type: string, description: "URL pública del Dolibarr del alumno o del equipo." }
        dolibarrUsername: { type: string, description: "Usuario para auto-login en Dolibarr." }
        dolibarrPassword: { type: string, description: "Contraseña para auto-login en Dolibarr." }
        mode:             { type: string, enum: [individual, team], description: "individual = Dolibarr propio del alumno; team = Dolibarr compartido del equipo (vive en el contenedor del profesor)." }
        teamLetter:       { type: string, nullable: true, description: "Letra del equipo (A, B, C…). Solo si mode = team." }
        teamName:         { type: string, nullable: true, description: "Nombre del equipo. Solo si mode = team." }

    # ── Employee ─────────────────────────────────────────
    Employee:
      type: object
      required: [id, studentId, firstName, lastName, jobTitle, contractType, groupCategory, salaryBase, extraPayments, irpfRate, active, dolibarrSyncStatus, createdAt]
      properties:
        id:                   { type: integer }
        studentId:            { type: integer }
        firstName:            { type: string }
        lastName:             { type: string }
        dni:                  { type: ["string", "null"] }
        jobTitle:             { type: string }
        contractType:         { type: string, enum: [indefinido, temporal] }
        groupCategory:        { type: integer }
        salaryBase:           { type: number }
        extraPayments:        { type: integer, enum: [12, 14] }
        irpfRate:             { type: number }
        active:               { type: boolean }
        dolibarrEmployeeId:   { type: ["integer", "null"] }
        dolibarrSyncStatus:   { type: string, enum: [pending, deploying, synced, error] }
        dolibarrSyncError:    { type: ["string", "null"] }
        createdAt:            { type: string, format: date-time }

    EmployeeInput:
      type: object
      required: [studentId, firstName, lastName, jobTitle, salaryBase]
      properties:
        studentId:     { type: integer }
        firstName:     { type: string, minLength: 1 }
        lastName:      { type: string, minLength: 1 }
        dni:           { type: string }
        jobTitle:      { type: string, minLength: 1 }
        contractType:  { type: string, enum: [indefinido, temporal], default: indefinido }
        groupCategory: { type: integer, minimum: 1, maximum: 11, default: 7 }
        salaryBase:    { type: number, minimum: 0 }
        extraPayments: { type: integer, enum: [12, 14], default: 14 }
        irpfRate:      { type: number, minimum: 0, maximum: 45, default: 15 }

    # ── Payroll ───────────────────────────────────────────
    PayrollInput:
      type: object
      required: [employeeId, studentId, periodMonth, periodYear]
      properties:
        employeeId:        { type: integer }
        studentId:         { type: integer }
        periodMonth:       { type: integer, minimum: 1, maximum: 12 }
        periodYear:        { type: integer }
        plusConvenio:      { type: number, default: 0 }
        plusTransporte:    { type: number, default: 0 }
        importeHorasExtra: { type: number, default: 0 }
        otroDevengo:       { type: number, default: 0 }
        otroDevengoLabel:  { type: string }
        irpfRateOverride:  { type: number, minimum: 0, maximum: 45 }

    PayrollCalculation:
      type: object
      required: [employeeId, studentId, periodMonth, periodYear, salaryBase, plusConvenio, plusTransporte, importeHorasExtra, otroDevengo, prorataPagasExtra, totalDevengos, baseCotizacion, ssContingencias, ssDesempleo, ssFp, totalSsTrabajador, irpfRate, irpfAmount, totalDeducciones, liquidoPercibir, ssEmpresaContingencias, ssEmpresaDesempleo, ssEmpresaFp, ssEmpresaFogasa, totalSsEmpresa, totalCosteEmpresa]
      properties:
        employeeId:             { type: integer }
        studentId:              { type: integer }
        periodMonth:            { type: integer }
        periodYear:             { type: integer }
        salaryBase:             { type: number }
        plusConvenio:           { type: number }
        plusTransporte:         { type: number }
        importeHorasExtra:      { type: number }
        otroDevengo:            { type: number }
        otroDevengoLabel:       { type: ["string", "null"] }
        prorataPagasExtra:      { type: number }
        totalDevengos:          { type: number }
        baseCotizacion:         { type: number }
        ssContingencias:        { type: number }
        ssDesempleo:            { type: number }
        ssFp:                   { type: number }
        totalSsTrabajador:      { type: number }
        irpfRate:               { type: number }
        irpfAmount:             { type: number }
        totalDeducciones:       { type: number }
        liquidoPercibir:        { type: number }
        ssEmpresaContingencias: { type: number }
        ssEmpresaDesempleo:     { type: number }
        ssEmpresaFp:            { type: number }
        ssEmpresaFogasa:        { type: number }
        totalSsEmpresa:         { type: number }
        totalCosteEmpresa:      { type: number }

    Payroll:
      allOf:
        - $ref: "#/components/schemas/PayrollCalculation"
        - type: object
          required: [id, dolibarrSyncStatus, createdAt]
          properties:
            id:                   { type: integer }
            dolibarrSalaryId:     { type: ["integer", "null"] }
            dolibarrAccountingId: { type: ["integer", "null"] }
            dolibarrSyncStatus:   { type: string, enum: [pending, deploying, synced, error] }
            dolibarrSyncError:    { type: ["string", "null"] }
            createdAt:            { type: string, format: date-time }

    # ── SS Liquidaciones ─────────────────────────────────
    SSLine:
      type: object
      required: [employeeId, payrollId, employeeName, baseCotizacion, ssTrabajador, ssEmpresa, totalSS, irpf, liquidoPercibir]
      properties:
        employeeId:      { type: integer }
        payrollId:       { type: integer }
        employeeName:    { type: string }
        jobTitle:        { type: string }
        contractType:    { type: string }
        baseCotizacion:  { type: number }
        ssTrabajador:    { type: number }
        ssEmpresa:       { type: number }
        totalSS:         { type: number }
        irpf:            { type: number }
        liquidoPercibir: { type: number }

    SSSummary:
      type: object
      required: [studentId, periodMonth, periodYear, lines, totalSSTrabajadores, totalSSEmpresa, totalSSIngresar, totalIrpf, ssPayment]
      properties:
        studentId:           { type: integer }
        periodMonth:         { type: integer }
        periodYear:          { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/SSLine" }
        totalSSTrabajadores: { type: number }
        totalSSEmpresa:      { type: number }
        totalSSIngresar:     { type: number }
        totalIrpf:           { type: number }
        ssPayment:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SSPaymentRecord"
        ssPaymentRecord:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SSPaymentRecord"

    SSPaymentRecord:
      type: object
      required: [id, ssStatus, irpfStatus]
      properties:
        id:                       { type: integer }
        ssStatus:                 { type: string, enum: [pending, paid, error] }
        irpfStatus:               { type: string, enum: [pending, paid, error] }
        ssDolibarrAccountingId:   { type: ["integer", "null"] }
        irpfDolibarrAccountingId: { type: ["integer", "null"] }

    SSPayInput:
      type: object
      required: [month, year]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        year:  { type: integer }

    SSPayResult:
      type: object
      required: [accountingId, total, message]
      properties:
        accountingId: { type: integer }
        total:        { type: number }
        message:      { type: string }

    # ── Reset password ───────────────────────────────────
    ResetPasswordResult:
      type: object
      required: [studentId, newPassword, dolibarrUpdated]
      properties:
        studentId:       { type: integer }
        newPassword:     { type: string }
        dolibarrUpdated: { type: boolean }
        message:         { type: string }

    # ── Activity log ──────────────────────────────────────
    ActivityEntry:
      type: object
      required: [id, action, entityType, entityName, createdAt]
      properties:
        id:          { type: integer }
        action:      { type: string }
        entityType:  { type: string }
        entityId:    { type: ["integer", "null"] }
        entityName:  { type: string }
        details:     { type: ["string", "null"] }
        createdAt:   { type: string, format: date-time }

    # ── Settings ─────────────────────────────────────────
    Settings:
      type: object
      required: [taxSystem, currency, language, baseDomain]
      properties:
        taxSystem:
          type: string
          enum: [iva, igic]
        currency:
          type: string
        language:
          type: string
        baseDomain:
          type: string
          description: "Dominio base público para los Dolibarr de los alumnos (ej. erp.iesmmg.es). Cada alumno será accesible en https://{username}.{baseDomain}/"

    SettingsInput:
      type: object
      properties:
        taxSystem:
          type: string
          enum: [iva, igic]
        baseDomain:
          type: string

    # ── Teacher session / panel ──────────────────────────
    TeacherCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    TeacherProfile:
      type: object
      required: [id, firstName, lastName, email, username, dolibarrSyncStatus]
      properties:
        id:                 { type: integer }
        firstName:          { type: string }
        lastName:           { type: string }
        email:              { type: string }
        username:           { type: string }
        dolibarrSyncStatus: { type: string }

    TeacherSession:
      type: object
      required: [token, teacher]
      properties:
        token:   { type: string }
        teacher: { $ref: "#/components/schemas/TeacherProfile" }

    TeacherDolibarrInfo:
      type: object
      required: [deployed, containerName]
      properties:
        deployed:         { type: boolean }
        publicUrl:        { type: ["string", "null"] }
        containerName:    { type: string }
        dolibarrUsername: { type: ["string", "null"] }
        dolibarrPassword: { type: ["string", "null"] }

    TeacherStats:
      type: object
      required: [groupCount, studentCount, activeContainers, teamCount]
      properties:
        groupCount:       { type: integer }
        studentCount:     { type: integer }
        activeContainers: { type: integer }
        teamCount:        { type: integer }

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    ResetPasswordSimple:
      type: object
      required: [ok, newPassword]
      properties:
        ok:          { type: boolean }
        newPassword: { type: string }

    SimpleDeployResult:
      type: object
      required: [ok]
      properties:
        ok:        { type: boolean }
        publicUrl: { type: string }
        state:     { type: string }

    SimpleStateResult:
      type: object
      required: [ok, state]
      properties:
        ok:    { type: boolean }
        state: { type: string }

    StudentContainerState:
      type: object
      required: [studentId, exists, state, containerName]
      properties:
        studentId:     { type: integer }
        exists:        { type: boolean }
        state:         { type: string }
        containerName: { type: string }
        publicUrl:     { type: ["string", "null"] }
        startedAt:     { type: ["string", "null"] }

    # ── Teams ────────────────────────────────────────────
    Team:
      type: object
      required: [id, groupId, groupName, letter, name, dolibarrSyncStatus, memberCount, createdAt]
      properties:
        id:                 { type: integer }
        groupId:            { type: integer }
        groupName:          { type: string }
        letter:             { type: string }
        name:               { type: string }
        dolibarrSyncStatus: { type: string }
        dolibarrSyncError:  { type: ["string", "null"] }
        memberCount:        { type: integer }
        createdAt:          { type: string, format: date-time }

    TeamMember:
      type: object
      required: [id, firstName, lastName, username, email]
      properties:
        id:        { type: integer }
        firstName: { type: string }
        lastName:  { type: string }
        username:  { type: string }
        email:     { type: string }

    TeamWithMembers:
      allOf:
        - $ref: "#/components/schemas/Team"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items: { $ref: "#/components/schemas/TeamMember" }
            publicUrl:        { type: ["string", "null"] }
            teacherUsername:  { type: string }

    TeamInput:
      type: object
      required: [groupId, name]
      properties:
        groupId: { type: integer }
        name:    { type: string, minLength: 1 }

    AddTeamMemberInput:
      type: object
      required: [studentId]
      properties:
        studentId: { type: integer }

    AddTeamMemberResult:
      type: object
      required: [ok, provisioned]
      properties:
        ok:             { type: boolean }
        provisioned:    { type: boolean }
        provisionError: { type: ["string", "null"] }

    # ── Stats ────────────────────────────────────────────
    Stats:
      type: object
      required: [totalTeachers, totalGroups, totalStudents, studentsPerGroup]
      properties:
        totalTeachers:   { type: integer }
        totalGroups:     { type: integer }
        totalStudents:   { type: integer }
        studentsPerGroup:
          type: array
          items:
            type: object
            required: [groupId, groupName, count]
            properties:
              groupId:   { type: integer }
              groupName: { type: string }
              count:     { type: integer }
